<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Login - Billing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center h-screen">

  <div class="bg-gray-800 p-6 rounded-xl w-80 shadow-lg">
    <h2 class="text-white text-xl font-bold mb-4 text-center">Login</h2>

    <input id="username" type="text" placeholder="Username" class="w-full p-2 mb-3 rounded bg-gray-700 text-white">

    <div class="relative">
      <input id="password" type="password" placeholder="Password" class="w-full p-2 rounded bg-gray-700 text-white">

      <button type="button" onclick="togglePassword(this)" class="absolute right-2 top-2 text-sm text-gray-300">
        Show
      </button>
    </div>

    <button id="loginBtn" onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 text-white p-2 rounded disabled:opacity-60 disabled:cursor-wait">
      <span id="loginLabel">Login</span>
    </button>

    <p id="error" class="text-red-400 text-sm mt-3 text-center hidden">
      Invalid login
    </p>
  </div>

  <script>

    async function login() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      const env = localStorage.getItem("env") || "test";

      const button = document.getElementById("loginBtn");
      const label = document.getElementById("loginLabel");
      const error = document.getElementById("error");

      if (!user || !pass) {
        error.textContent = "Enter your username and password";
        error.classList.remove("hidden");
        return;
      }

      button.disabled = true;
      label.textContent = "Signing in…";
      error.classList.add("hidden");

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);

      try {
        const url = new URL("https://script.google.com/macros/s/AKfycbzww1YOwhD18RuvKKQsSm-bcTKCZcBFbzE1r7hFc0JjM-rDCamBG5_0_zRcgqG3f5Sv/exec");
        url.search = new URLSearchParams({ action: "login", username: user, password: pass, env });

        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`Server error (${res.status})`);
        const data = await res.json();

        // ✅ DEBUG (VERY IMPORTANT)
        console.log("LOGIN RESPONSE:", data);
        console.log("LOGIN ACCESS:", data.access);

        if (data.success) {
          sessionStorage.setItem("isLoggedIn", "true");

          // ✅ ENV
          sessionStorage.setItem("env", data.env || env);

          // ✅ ROLE
          sessionStorage.setItem("role", data.role);

          // ✅ USERNAME
          sessionStorage.setItem("username", data.username);

          // ✅ ACCESS (NO HARDCODE)
          sessionStorage.setItem("access", data.access);

          // ✅ SAFETY CHECK (OPTIONAL BUT RECOMMENDED)
          if (!data.access) {
            console.warn("⚠️ No access received from backend");
          }

          window.location.href = "index.html";
        } else {
          error.textContent = data.message || "Invalid username or password";
          error.classList.remove("hidden");
        }

      } catch (err) {
        error.textContent = err.name === "AbortError"
          ? "The server took too long. Please try again."
          : (!navigator.onLine ? "You appear to be offline." : "Login failed. Please try again.");
        error.classList.remove("hidden");
      } finally {
        clearTimeout(timeout);
        button.disabled = false;
        label.textContent = "Login";
      }
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });
  </script>


  <script>
    function togglePassword(btn) {
      const passField = document.getElementById("password");

      if (passField.type === "password") {
        passField.type = "text";
        btn.innerText = "Hide";
      } else {
        passField.type = "password";
        btn.innerText = "Show";
      }
    }
  </script>



</body>

</html>
